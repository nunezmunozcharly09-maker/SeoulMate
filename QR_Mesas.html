<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeoulMate · Códigos QR por mesa</title>
<style>
  :root { --burgundy:#6b1d2f; --pink:#f7d6de; --bg:#fff8f9; --ink:#2b1a1f; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--burgundy); color:#fff; padding:18px 20px; }
  header h1 { margin:0; font-size:1.25rem; }
  header p { margin:4px 0 0; opacity:.85; font-size:.9rem; }
  .panel { max-width:900px; margin:18px auto; padding:0 16px; }
  .controls { background:#fff; border:1px solid var(--pink); border-radius:12px; padding:16px; display:grid; gap:12px; }
  label { font-weight:600; font-size:.9rem; display:block; margin-bottom:4px; }
  input { width:100%; padding:10px 12px; border:1px solid #d9b8c0; border-radius:8px; font-size:1rem; }
  .row { display:grid; grid-template-columns:1fr 130px; gap:12px; }
  .btns { display:flex; gap:10px; flex-wrap:wrap; }
  button { background:var(--burgundy); color:#fff; border:0; border-radius:8px; padding:11px 18px; font-size:1rem; cursor:pointer; }
  button.sec { background:#fff; color:var(--burgundy); border:1px solid var(--burgundy); }
  .hint { font-size:.82rem; color:#6d5a5f; margin:0; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; margin-top:18px; }
  .card { background:#fff; border:1px solid var(--pink); border-radius:12px; padding:14px; text-align:center; break-inside:avoid; page-break-inside:avoid; }
  .card h2 { margin:0 0 2px; color:var(--burgundy); font-size:1.4rem; }
  .card .sub { font-size:.8rem; color:#6d5a5f; margin:0 0 8px; }
  .card canvas { width:100%; max-width:200px; height:auto; image-rendering:pixelated; }
  .card .url { font-size:.65rem; word-break:break-all; color:#8a7378; margin:6px 0 8px; }
  .card button { padding:7px 12px; font-size:.85rem; }
  @media print {
    header, .controls, .card button, .noprint { display:none !important; }
    body { background:#fff; }
    #grid { grid-template-columns:repeat(2,1fr); margin:0; }
    .card { border:1px dashed #999; }
  }
</style>
</head>
<body>
<header>
  <h1>🌸 SeoulMate · Códigos QR por mesa</h1>
  <p>Cada QR abre el menú con su mesa ya detectada.</p>
</header>

<div class="panel">
  <div class="controls">
    <div>
      <label for="base">Dirección del menú (se detecta sola al abrir esta página en tu sitio)</label>
      <input id="base" type="url" inputmode="url" autocomplete="off">
      <p class="hint" id="aviso"></p>
    </div>
    <div class="row">
      <div>
        <label for="desde">Mesa inicial</label>
        <input id="desde" type="number" min="1" max="99" value="1">
      </div>
      <div>
        <label for="hasta">Mesa final</label>
        <input id="hasta" type="number" min="1" max="99" value="10">
      </div>
    </div>
    <div class="btns">
      <button id="gen">Generar QR</button>
      <button id="imp" class="sec">🖨️ Imprimir</button>
    </div>
  </div>
  <div id="grid"></div>
</div>

<script src="Js/qrcode.js"></script>
<script>
(function () {
  var base = document.getElementById('base');
  var aviso = document.getElementById('aviso');
  var grid = document.getElementById('grid');

  // Detecta la dirección real: la misma carpeta donde está esta página + Menu.html
  var detectada = location.href.replace(/[?#].*$/, '').replace(/[^\/]*$/, '') + 'Menu.html';
  base.value = detectada;

  function revisarAviso() {
    var v = base.value.trim();
    if (/^file:|localhost|127\.0\.0\.1|192\.168\.|^10\./.test(v)) {
      aviso.textContent = '⚠️ Esta dirección solo funciona en tu computadora/red local. Para los QR reales abre esta página desde tu dominio ya publicado (o escribe aquí tu dirección final).';
      aviso.style.color = '#b3261e';
    } else {
      aviso.textContent = '✔ Dirección lista. Revisa que abra tu menú antes de imprimir.';
      aviso.style.color = '#2e7d32';
    }
  }

  function crearQR(texto) {
    var q = new window.QRCodeLib(-1, 2);   // tamaño automático, corrección de errores M
    q.addData(texto);
    q.make();
    var n = q.getModuleCount(), borde = 4, px = 8;
    var size = (n + borde * 2) * px;
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#000';
    for (var r = 0; r < n; r++)
      for (var k = 0; k < n; k++)
        if (q.isDark(r, k)) ctx.fillRect((k + borde) * px, (r + borde) * px, px, px);
    return c;
  }

  function generar() {
    var b = base.value.trim().replace(/[?#].*$/, '');
    var d = Math.max(1, Math.min(99, parseInt(document.getElementById('desde').value, 10) || 1));
    var h = Math.max(1, Math.min(99, parseInt(document.getElementById('hasta').value, 10) || d));
    if (h < d) { var t = d; d = h; h = t; }
    grid.innerHTML = '';
    for (var m = d; m <= h; m++) {
      var url = b + '?mesa=' + m;
      var card = document.createElement('div');
      card.className = 'card';
      var h2 = document.createElement('h2'); h2.textContent = 'Mesa ' + String(m).padStart(2, '0');
      var sub = document.createElement('p'); sub.className = 'sub'; sub.textContent = 'Escanea para ver el menú y pedir';
      var cv = crearQR(url);
      var u = document.createElement('p'); u.className = 'url'; u.textContent = url;
      var btn = document.createElement('button'); btn.textContent = 'Descargar PNG';
      btn.addEventListener('click', (function (canvas, num) {
        return function () {
          var a = document.createElement('a');
          a.href = canvas.toDataURL('image/png');
          a.download = 'QR_Mesa_' + String(num).padStart(2, '0') + '.png';
          a.click();
        };
      })(cv, m));
      card.appendChild(h2); card.appendChild(sub); card.appendChild(cv); card.appendChild(u); card.appendChild(btn);
      grid.appendChild(card);
    }
    revisarAviso();
  }

  document.getElementById('gen').addEventListener('click', generar);
  document.getElementById('imp').addEventListener('click', function () { window.print(); });
  base.addEventListener('input', revisarAviso);
  generar();
})();
</script>
</body>
</html>
